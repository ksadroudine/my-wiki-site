<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Karim's Knowledge Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sidebar-overlay"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="search">
        <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" aria-label="Search">
      </div>
      <div id="results" class="results" hidden></div>
      <nav id="nav">
        <details id="concepts-section" open>
          <summary>Concepts <span id="concept-count" class="count"></span></summary>
          <ul id="concept-list" class="list"></ul>
        </details>
        <details id="tags-section">
          <summary>Tags</summary>
          <div id="tag-tree"></div>
        </details>
      </nav>
    </aside>
    <div class="main">
      <header id="masthead">
        <a href="#/">Karim's Knowledge Database</a>
        <button id="filter-toggle" aria-label="Toggle filters">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M1 3h14M4 8h8M7 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Filters
        </button>
      </header>
      <main id="article" class="article">
        <p class="muted">Loading…</p>
      </main>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
